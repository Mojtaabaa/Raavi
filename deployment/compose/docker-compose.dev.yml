# Development infrastructure only (the app runs from source). NOT for production.
# Usage: docker compose -f deployment/compose/docker-compose.dev.yml --env-file deployment/compose/.env up -d
# Copy .env.example to .env first and set the passwords.
#
# Redis protocol is provided by Valkey (BSD-3) — see docs/architecture/DEPENDENCY_AND_LICENSING.md.
# MinIO is used here for development convenience only (AGPLv3; production store decided per customer, ADR-014).
name: raavi-dev

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${RAAVI_DEV_SQL_PASSWORD:?set in .env}
    ports: ["14333:1433"]
    volumes: [sqlserver-data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  valkey:
    image: valkey/valkey:8.1
    command: ["valkey-server", "--appendonly", "no"]
    ports: ["6379:6379"]

  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${RAAVI_DEV_OPENSEARCH_PASSWORD:?set in .env}
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["9200:9200"]
    volumes: [opensearch-data:/usr/share/opensearch/data]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${RAAVI_DEV_S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${RAAVI_DEV_S3_SECRET_KEY:?set in .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["8025:8025", "1025:1025"]

volumes:
  sqlserver-data:
  opensearch-data:
  minio-data:
